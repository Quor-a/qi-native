<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>栖 — 3D 形象</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#f5e6d3}
  #stage{
    position:absolute;inset:0;width:100%;height:100%;
    display:block;
  }
  #loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#b08968;font-family:sans-serif;font-size:14px;z-index:10;
    transition:opacity .4s ease;
  }
  #loading.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="loading">加载 3D 模型中...</div>
<!-- 内嵌模型（base64），用 <script> 加载以绕开 WebView 在 file:// 下禁止 XHR 的限制 -->
<script src="live2d_assets/vertex_groups.js"></script>
<script src="live2d_assets/model_glb.js"></script>
<script src="glb-renderer.js"></script>
</body>
</html>
